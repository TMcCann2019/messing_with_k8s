apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: messing
spec:
  replicas: {{.Values.replicaCount.backend}}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: {{.Values.image.backend.repository}}:{{.Values.image.backend.tag}}
          imagePullPolicy: {{.Values.image.backend.pullPolicy}}
          ports:
            - containerPort: 8081